services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foxiby
      POSTGRES_PASSWORD: foxiby
      POSTGRES_DB: foxiby
    ports:
      - "5432:5432"
    volumes:
      - foxiby_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  foxiby_postgres:
